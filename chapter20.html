<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive HTML</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header, footer {
            padding: 20px;
            text-align: center;
        }

        nav {
            padding: 15px;
            text-align: center;
        }

        nav a {
            margin: 10px;
        }

        .container {
            display: flex;
            gap: 20px;
            width: 90%;
            margin: auto;
        }

        .column {
            width: 50%;
            padding: 20px;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            border: 1px solid black;
        }

        /* Mobile */
        @media screen and (max-width: 600px) {
            .container {
                flex-direction: column;
            }

            .column {
                width: 100%;
            }

            nav a {
                display: block;
            }

            h1 {
                font-size: 8vw;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Responsive Website</h1>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>

    <main class="container">

        <section class="column">
            <h2>Content</h2>
            <p>This webpage adjusts according to screen size.</p>

            <img src="image.jpg" alt="Responsive Image">
        </section>

        <section class="column">
            <h2>Information</h2>

            <div class="table-container">
                <table>
                    <tr>
                        <th>Name</th>
                        <th>Age</th>
                    </tr>
                    <tr>
                        <td>Ali</td>
                        <td>20</td>
                    </tr>
                    <tr>
                        <td>Ahmed</td>
                        <td>22</td>
                    </tr>
                </table>
            </div>
        </section>

    </main>

    <footer>
        <p>© 2026 My Website</p>
    </footer>

</body>
</html>
