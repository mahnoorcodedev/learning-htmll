<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>

<body>

    <h1>Registration Form</h1>

    <form action="register.php" method="post">

        <!-- Full Name -->
        <label for="name">Full Name:</label>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
        >
        <br><br>


        <!-- Password -->
        <label for="password">Password:</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >
        <br><br>


        <!-- Email -->
        <label for="email">Email:</label>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >
        <br><br>


        <!-- Age -->
        <label for="age">Age:</label>
        <input
            type="number"
            id="age"
            name="age"
            min="18"
            max="60"
            required
        >
        <br><br>


        <!-- Phone -->
        <label for="phone">Phone:</label>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="03XX-XXXXXXX"
            required
        >
        <br><br>


        <!-- Website -->
        <label for="website">Website:</label>
        <input
            type="url"
            id="website"
            name="website"
            placeholder="https://example.com"
        >
        <br><br>


        <!-- Gender -->
        <label>Gender:</label>

        <input
            type="radio"
            id="male"
            name="gender"
            value="male"
            required
        >
        <label for="male">Male</label>

        <input
            type="radio"
            id="female"
            name="gender"
            value="female"
        >
        <label for="female">Female</label>

        <br><br>


        <!-- Skills -->
        <label>Skills:</label>

        <input
            type="checkbox"
            id="html"
            name="skills"
            value="HTML"
        >
        <label for="html">HTML</label>

        <input
            type="checkbox"
            id="css"
            name="skills"
            value="CSS"
        >
        <label for="css">CSS</label>

        <input
            type="checkbox"
            id="javascript"
            name="skills"
            value="JavaScript"
        >
        <label for="javascript">JavaScript</label>

        <br><br>


        <!-- Upload Resume -->
        <label for="resume">Upload Resume:</label>
        <input
            type="file"
            id="resume"
            name="resume"
            required
        >
        <br><br>


        <!-- Date of Birth -->
        <label for="dob">Date of Birth:</label>
        <input
            type="date"
            id="dob"
            name="dob"
            required
        >
        <br><br>


        <!-- Preferred Time -->
        <label for="time">Preferred Time:</label>
        <input
            type="time"
            id="time"
            name="time"
        >
        <br><br>


        <!-- Favorite Color -->
        <label for="color">Favorite Color:</label>
        <input
            type="color"
            id="color"
            name="color"
        >
        <br><br>


        <!-- Experience -->
        <label for="experience">Experience:</label>
        <input
            type="range"
            id="experience"
            name="experience"
            min="0"
            max="10"
            step="1"
            value="5"
        >
        <br><br>


        <!-- Hidden Field -->
        <input
            type="hidden"
            name="user_id"
            value="101"
        >


        <!-- Submit Button -->
        <input
            type="submit"
            value="Register"
        >

        <!-- Reset Button -->
        <input
            type="reset"
            value="Reset"
        >

    </form>

</body>
</html>
