<!DOCTYPE html>
<html>
<head>
    <title>HTML Multimedia Demo</title>
</head>
<body>

    <h1>HTML Multimedia Demo</h1>

    <!-- Audio -->
    <h2>Audio</h2>

    <audio controls loop>
        <source src="music.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <!-- Video -->
    <h2>Video</h2>

    <video width="600" controls poster="poster.jpg">
        <source src="movie.mp4" type="video/mp4">
        <source src="movie.webm" type="video/webm">

        <track src="subtitles.vtt"
               kind="subtitles"
               srclang="en"
               label="English">

        Your browser does not support video.
    </video>

    <!-- YouTube -->
    <h2>YouTube Video</h2>

    <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/VIDEO_ID"
        title="YouTube Video"
        allowfullscreen>
    </iframe>

</body>
</html>
